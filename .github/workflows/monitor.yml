name: monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check | dump | test_detect | test_alert"
        default: "dump"
        type: choice
        options: [check, dump, test_detect, test_alert]

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - run: python monitor.py
        env:
          MODE: ${{ github.event.inputs.mode || 'check' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BMS_URL: ${{ secrets.BMS_URL }}
          MY_NUMBER: ${{ secrets.MY_NUMBER }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_CALL_FROM: ${{ secrets.TWILIO_CALL_FROM }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: shot.png
          if-no-files-found: ignore
